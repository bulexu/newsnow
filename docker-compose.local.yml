services:
  cloakbrowser:
    image: cloakhq/cloakbrowser:latest
    container_name: cloakbrowser
    command: cloakserve
    environment:
      - TZ=Asia/Shanghai
      - CLOAKBROWSER_AUTO_UPDATE=false
    ports:
      - '9222:9222'
    restart: unless-stopped

  newsnow:
    build: .
    depends_on:
      - cloakbrowser
    ports:
      - '4444:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - G_CLIENT_ID=
      - G_CLIENT_SECRET=
      - JWT_SECRET=
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - CLOAKBROWSER_CDP_URL=http://cloakbrowser:9222

volumes:
  newsnow_data:
    name: newsnow_data
